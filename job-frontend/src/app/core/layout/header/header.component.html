<header id="header" class="fixed inset-x-0 top-0 z-50 border-b border-white/10 font-body transition-all duration-300"
  [ngClass]="isScrolled ? 'h-[72px] bg-[#07142F]/95 backdrop-blur-md shadow-lg shadow-black/20' : 'h-[84px] bg-[#07142F]/65 backdrop-blur-sm'">
  <div class="mx-auto flex h-full w-full max-w-[1440px] items-center justify-between px-6 sm:px-10 lg:px-12">
    <!-- Brand Logo (Left) -->
    <a (click)="navigateTo('home')" class="flex shrink-0 items-center cursor-pointer" [attr.aria-label]="'header.home' | t"
      [title]="'header.home' | t">
      <img class="h-8 sm:h-9 w-auto object-contain transition-transform duration-200 hover:scale-105" src="assets/web_css/img/logo.png"
        [attr.alt]="'header.logoAlt' | t" />
    </a>

    <!-- Desktop Primary Navigation (Center/Right) -->
    <nav aria-label="Primary navigation"
      class="hidden md:flex items-center gap-1.5 lg:gap-2 xl:gap-3 flex-nowrap shrink-0">
      
      <!-- Nav Item: Trang chủ -->
      <button type="button"
        (click)="navigateTo('home')"
        class="nav-link relative rounded-xl px-3 xl:px-3.5 py-2 text-[15px] xl:text-[16px] font-semibold transition-all duration-200 cursor-pointer"
        [ngClass]="activeNav === 'home' ? 'text-white' : 'text-white/75 hover:text-white hover:bg-white/5'">
        <span>{{ 'header.home' | t }}</span>
        @if (activeNav === 'home') {
          <span class="nav-active-pill absolute bottom-0.5 left-1/2 h-[3px] w-6 -translate-x-1/2 rounded-full bg-[#1E63F3]"></span>
        }
      </button>

      <!-- Nav Item: Tìm việc -->
      <button type="button"
        (click)="navigateTo('jobs')"
        class="nav-link relative rounded-xl px-3 xl:px-3.5 py-2 text-[15px] xl:text-[16px] font-semibold transition-all duration-200 cursor-pointer"
        [ngClass]="activeNav === 'jobs' ? 'text-white' : 'text-white/75 hover:text-white hover:bg-white/5'">
        <span>{{ 'header.jobs' | t }}</span>
        @if (activeNav === 'jobs') {
          <span class="nav-active-pill absolute bottom-0.5 left-1/2 h-[3px] w-6 -translate-x-1/2 rounded-full bg-[#1E63F3]"></span>
        }
      </button>

      <!-- Nav Item: Blog -->
      <button type="button"
        (click)="navigateTo('blog')"
        class="nav-link relative rounded-xl px-3 xl:px-3.5 py-2 text-[15px] xl:text-[16px] font-semibold transition-all duration-200 cursor-pointer"
        [ngClass]="activeNav === 'blog' ? 'text-white' : 'text-white/75 hover:text-white hover:bg-white/5'">
        <span>{{ 'header.blog' | t }}</span>
        @if (activeNav === 'blog') {
          <span class="nav-active-pill absolute bottom-0.5 left-1/2 h-[3px] w-6 -translate-x-1/2 rounded-full bg-[#1E63F3]"></span>
        }
      </button>

      <!-- Nav Item: Về chúng tôi -->
      <button type="button"
        (click)="navigateTo('about')"
        class="nav-link relative rounded-xl px-3 xl:px-3.5 py-2 text-[15px] xl:text-[16px] font-semibold transition-all duration-200 cursor-pointer"
        [ngClass]="activeNav === 'about' ? 'text-white' : 'text-white/75 hover:text-white hover:bg-white/5'">
        <span>{{ 'header.about' | t }}</span>
        @if (activeNav === 'about') {
          <span class="nav-active-pill absolute bottom-0.5 left-1/2 h-[3px] w-6 -translate-x-1/2 rounded-full bg-[#1E63F3]"></span>
        }
      </button>

      <!-- Nav Item: Liên hệ -->
      <button type="button"
        (click)="navigateTo('contact')"
        class="nav-link relative rounded-xl px-3 xl:px-3.5 py-2 text-[15px] xl:text-[16px] font-semibold transition-all duration-200 cursor-pointer"
        [ngClass]="activeNav === 'contact' ? 'text-white' : 'text-white/75 hover:text-white hover:bg-white/5'">
        <span>{{ 'header.contact' | t }}</span>
        @if (activeNav === 'contact') {
          <span class="nav-active-pill absolute bottom-0.5 left-1/2 h-[3px] w-6 -translate-x-1/2 rounded-full bg-[#1E63F3]"></span>
        }
      </button>

      <!-- Segmented Language Switcher (No pink/red, pure navy/white segmented control) -->
      <div class="ml-2 xl:ml-4 inline-flex items-center rounded-full bg-white/10 border border-white/15 p-0.5 text-xs font-bold text-white shrink-0" role="group" aria-label="Language selection">
        <button
          type="button"
          (click)="switchLanguage('en')"
          class="rounded-full px-2.5 py-1 text-xs font-bold transition-all duration-200 cursor-pointer"
          [ngClass]="currentLanguage === 'en' ? 'bg-white text-[#1E63F3] shadow-sm font-extrabold' : 'text-white/75 hover:text-white'"
          aria-label="English">
          EN
        </button>
        <button
          type="button"
          (click)="switchLanguage('vi')"
          class="rounded-full px-2.5 py-1 text-xs font-bold transition-all duration-200 cursor-pointer"
          [ngClass]="currentLanguage === 'vi' ? 'bg-white text-[#1E63F3] shadow-sm font-extrabold' : 'text-white/75 hover:text-white'"
          aria-label="Tiếng Việt">
          VI
        </button>
      </div>

      <!-- Auth Buttons Area -->
      @if (isLoggedIn) {
      <button matButton [matMenuTriggerFor]="menu"
        class="ml-2 xl:ml-3 flex items-center gap-1.5 xl:gap-2 rounded-xl border border-white/15 bg-white/10 hover:bg-white/15 px-3.5 xl:px-4 py-2 text-sm font-semibold text-white shrink-0 whitespace-nowrap transition cursor-pointer">
        <span class="material-symbols-outlined text-[18px]">account_circle</span>
        <span>{{ 'header.account' | t }}</span>
        <span class="material-symbols-outlined text-[16px]">expand_more</span>
      </button>
      <mat-menu #menu="matMenu" class="rounded-2xl shadow-xl">
        <button mat-menu-item (click)="goInfor()">
          <span class="material-symbols-outlined mr-2 text-[18px] align-middle text-[#1E63F3]">person</span>
          <span class="font-medium text-slate-800">{{ 'header.accountInfo' | t }}</span>
        </button>
        <button mat-menu-item (click)="logout()">
          <span class="material-symbols-outlined mr-2 text-[18px] align-middle text-rose-600">logout</span>
          <span class="font-medium text-rose-600">{{ 'header.logout' | t }}</span>
        </button>
      </mat-menu>
      } @else {
      <div class="ml-2 xl:ml-3 flex items-center gap-2">
        <button
          type="button"
          (click)="openAuthModal('login')"
          class="rounded-xl px-3.5 py-2 text-sm font-semibold text-white/90 hover:text-white hover:bg-white/10 transition-colors cursor-pointer">
          {{ 'header.login' | t }}
        </button>
        <button
          type="button"
          (click)="openAuthModal('register')"
          class="rounded-xl bg-[#1E63F3] hover:bg-[#174FCB] px-4 py-2 text-sm font-bold text-white shadow-md shadow-[#1E63F3]/25 transition-all duration-200 hover:-translate-y-0.5 active:scale-95 cursor-pointer">
          {{ 'header.register' | t }}
        </button>
      </div>
      }
    </nav>
  </div>
</header>
<app-mobile-nav></app-mobile-nav>
