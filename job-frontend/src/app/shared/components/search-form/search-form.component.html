<form class="w-full max-w-[1120px] mx-auto relative z-20" (ngSubmit)="onSubmit()">
  <div
    class="flex flex-col gap-2 rounded-2xl bg-white p-2.5 shadow-[0_16px_40px_rgba(7,20,47,0.14)] border border-slate-100 ring-1 ring-black/5 md:flex-row md:items-center md:h-[74px] transition-all focus-within:ring-2 focus-within:ring-[#1E63F3]"
  >
    <!-- Keyword input -->
    <div class="relative flex flex-1 items-center px-4 py-2.5 min-h-[52px] md:min-h-0">
      <span class="material-symbols-outlined text-[#1E63F3] text-[22px] mr-3 shrink-0" aria-hidden="true">search</span>
      <label for="landing-search-title" class="sr-only">{{ 'searchForm.jobPlaceholder' | t }}</label>
      <input
        id="landing-search-title"
        type="text"
        name="title"
        [(ngModel)]="keyword"
        [placeholder]="'searchForm.jobPlaceholder' | t"
        [attr.aria-label]="'searchForm.jobPlaceholder' | t"
        class="w-full bg-transparent text-sm sm:text-base font-semibold text-slate-900 placeholder-slate-400 outline-none border-none p-0 focus:ring-0"
      />
    </div>

    <div class="hidden h-9 w-[1px] bg-[#DCE5F2] md:block shrink-0"></div>

    <!-- Category Custom Select -->
    <div class="relative flex-1 px-1 py-1 md:py-0">
      <app-custom-select
        id="landing-search-category"
        [ariaLabel]="'category.search.selectCategoryAria' | t"
        [placeholder]="'category.search.selectCategory' | t"
        icon="category"
        variant="search-bar"
        [searchable]="true"
        [searchPlaceholder]="'category.search.searchCategory' | t"
        [options]="categoryOptions"
        [value]="selectedCategory"
        (valueChange)="onCategorySelect($event)"
      ></app-custom-select>
    </div>

    <div class="hidden h-9 w-[1px] bg-[#DCE5F2] md:block shrink-0"></div>

    <!-- City Custom Select -->
    <div class="relative flex-1 px-1 py-1 md:py-0">
      <app-custom-select
        id="landing-search-area"
        [ariaLabel]="'category.search.selectLocationAria' | t"
        [placeholder]="'category.search.selectLocation' | t"
        icon="location_on"
        variant="search-bar"
        [searchable]="true"
        [searchPlaceholder]="'category.search.searchLocation' | t"
        [options]="locationOptions"
        [value]="selectedCity"
        (valueChange)="onCitySelect($event)"
      ></app-custom-select>
    </div>

    <!-- Submit Button -->
    <div class="shrink-0 w-full md:w-auto h-full flex items-center">
      <button
        type="submit"
        class="w-full md:w-auto h-[52px] md:h-[56px] inline-flex items-center justify-center gap-2 px-8 rounded-xl bg-[#1E63F3] hover:bg-[#174FCB] text-sm sm:text-base font-bold text-white shadow-md shadow-[#1E63F3]/25 transition-all duration-200 hover:shadow-lg hover:shadow-[#1E63F3]/35 hover:-translate-y-0.5 active:scale-95 cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-[#1E63F3]"
      >
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">search</span>
        <span>{{ 'searchForm.search' | t }}</span>
      </button>
    </div>
  </div>
</form>
