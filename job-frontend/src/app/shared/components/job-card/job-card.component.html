<div
  class="job-card group relative flex flex-col sm:flex-row sm:items-center justify-between p-4 sm:p-5 rounded-2xl bg-white border border-[#DCE5F2] hover:border-[#1E63F3] hover:shadow-lg hover:shadow-[#1E63F3]/10 hover:-translate-y-0.5 transition-all duration-200 cursor-pointer overflow-hidden gap-4"
>
  <!-- Full card clickable routerLink overlay -->
  <a
    [routerLink]="[detailRoute, job.id]"
    class="absolute inset-0 z-0 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#1E63F3] focus-visible:ring-offset-2 rounded-2xl"
    [attr.aria-label]="job.title + ' tại ' + companyName"
  ></a>

  <!-- Left: Company Logo + Job Info -->
  <div class="relative z-10 flex items-start sm:items-center gap-4 flex-1 min-w-0 pointer-events-none">
    <!-- Company Logo Container (64–72px) -->
    <div
      class="w-16 h-16 sm:w-[68px] sm:h-[68px] rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-center p-2 shrink-0 group-hover:border-blue-100 transition-colors duration-200 overflow-hidden"
    >
      <img
        [src]="job.logoUrl || image"
        [alt]="companyName"
        class="w-full h-full object-contain transition-transform duration-300 group-hover:scale-105"
        loading="lazy"
      />
    </div>

    <!-- Job Details -->
    <div class="flex-1 min-w-0 space-y-1.5">
      <!-- Title -->
      <h3
        class="text-base sm:text-lg font-bold text-[#0F172A] group-hover:text-[#1E63F3] transition-colors leading-snug line-clamp-2 pr-8 sm:pr-0"
      >
        {{ job.title }}
      </h3>

      <!-- Company Name -->
      <p class="text-xs sm:text-sm font-medium text-[#526077] truncate">
        {{ companyName }}
      </p>

      <!-- Meta info: Location, Salary, Employment type -->
      <div class="flex flex-wrap items-center gap-y-1.5 gap-x-3 text-xs sm:text-sm text-[#526077]">
        <!-- Location -->
        <div class="inline-flex items-center gap-1 shrink-0">
          <span class="material-symbols-outlined text-slate-400 text-[16px] sm:text-[18px]">location_on</span>
          <span class="truncate max-w-[140px] sm:max-w-[180px]">{{ job.address || ('category.card.nationwide' | t) }}</span>
        </div>

        <span class="text-slate-300 hidden sm:inline">&bull;</span>

        <!-- Employment Type (Shown ONLY here, not duplicated below) -->
        <div class="inline-flex items-center gap-1 shrink-0">
          <span class="material-symbols-outlined text-slate-400 text-[16px] sm:text-[18px]">schedule</span>
          <span>{{ formattedTime }}</span>
        </div>

        <span class="text-slate-300 hidden sm:inline">&bull;</span>

        <!-- Salary Badge -->
        <div class="inline-flex items-center gap-1 font-bold text-[#1E63F3] bg-[#EAF2FF] px-2.5 py-0.5 rounded-md border border-blue-100/60 shrink-0">
          <span class="material-symbols-outlined text-[15px]">payments</span>
          <span>{{ formattedSalary }}</span>
        </div>
      </div>

      <!-- Skill Tags (Shown ONLY if skills exist) -->
      @if (skillTags.length > 0) {
        <div class="flex flex-wrap items-center gap-1.5 pt-1">
          @for (tag of skillTags; track tag) {
            <span
              class="inline-block px-2.5 py-0.5 rounded-md text-[11px] sm:text-xs font-semibold bg-slate-100 text-slate-700 border border-slate-200/50 group-hover:bg-blue-50/60 group-hover:text-blue-700 group-hover:border-blue-100 transition-colors"
            >
              {{ tag }}
            </span>
          }
        </div>
      }
    </div>
  </div>

  <!-- Right: Bookmark Action Button -->
  <div class="relative z-10 sm:self-center shrink-0 flex items-center justify-end">
    <button
      type="button"
      (click)="toggleBookmark($event)"
      [attr.aria-label]="isSaved ? ('category.card.unsaveJob' | t) : ('category.card.saveJob' | t)"
      [title]="isSaved ? ('category.card.unsaveJob' | t) : ('category.card.saveJob' | t)"
      class="w-10 h-10 rounded-full flex items-center justify-center transition-all duration-200 cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-[#1E63F3]"
      [ngClass]="
        isSaved
          ? 'bg-[#EAF2FF] text-[#1E63F3] border border-[#BFDBFE] shadow-sm'
          : 'text-slate-400 hover:text-[#1E63F3] hover:bg-[#EAF2FF]/70 bg-slate-50/80 border border-slate-100'
      "
    >
      <span
        class="material-symbols-outlined text-[20px] transition-transform duration-200 active:scale-125"
        [style.font-variation-settings]="isSaved ? '\'FILL\' 1' : '\'FILL\' 0'"
      >
        bookmark
      </span>
    </button>
  </div>
</div>
