<article
  class="flex w-full flex-col justify-between gap-4 rounded-2xl border border-[#DCE5F2] bg-white p-4 shadow-sm sm:flex-row sm:items-center sm:p-5"
  aria-hidden="true">
  <div class="flex min-w-0 flex-1 items-start gap-4 sm:items-center">
    <!-- Company logo -->
    <div class="animate-shimmer h-16 w-16 shrink-0 rounded-xl border border-slate-100 bg-slate-100 sm:h-[68px] sm:w-[68px]"></div>

    <div class="min-w-0 flex-1 space-y-2">
      <!-- Job title, company, location, work type and salary -->
      <div class="space-y-1.5">
        <div class="animate-shimmer h-5 w-[78%] rounded-md bg-slate-200"></div>
        <div class="animate-shimmer h-5 w-[48%] rounded-md bg-slate-200 sm:hidden"></div>
      </div>
      <div class="animate-shimmer h-3.5 w-[38%] rounded-md bg-slate-100"></div>

      <div class="flex flex-wrap items-center gap-2 pt-1">
        <div class="animate-shimmer h-4 w-28 rounded-md bg-slate-100"></div>
        <div class="animate-shimmer h-4 w-20 rounded-md bg-slate-100"></div>
        <div class="animate-shimmer h-6 w-28 rounded-md border border-blue-100 bg-blue-50"></div>
      </div>

      <!-- Skill tags -->
      <div class="flex flex-wrap items-center gap-1.5 pt-1">
        <div class="animate-shimmer h-5 w-14 rounded-md bg-slate-100"></div>
        <div class="animate-shimmer h-5 w-20 rounded-md bg-slate-100"></div>
        <div class="animate-shimmer h-5 w-16 rounded-md bg-slate-100"></div>
      </div>
    </div>
  </div>

  <!-- Bookmark action -->
  <div class="flex shrink-0 items-center justify-end sm:self-center">
    <div class="animate-shimmer h-10 w-10 rounded-full border border-slate-100 bg-slate-100"></div>
  </div>
</article>
