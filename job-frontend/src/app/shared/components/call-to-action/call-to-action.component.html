<section class="relative overflow-hidden py-16 font-body" [class.mt-12]="withTopMargin" [id]="sectionId">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="cta-banner relative overflow-hidden rounded-3xl px-6 py-16 shadow-2xl sm:px-12 sm:py-20 lg:px-16 text-center">
      <!-- Dark overlay for text contrast and legibility -->
      <div class="absolute inset-0 bg-slate-950/60 z-0"></div>

      <div class="relative z-10 mx-auto max-w-3xl space-y-6">
        <h2 class="font-headline text-3xl font-extrabold tracking-tight text-white sm:text-4xl lg:text-5xl">
          {{ title || ('callToAction.title' | t) }}
        </h2>
        <p class="mx-auto max-w-2xl text-base leading-relaxed text-blue-100 sm:text-lg">
          {{ description || ('callToAction.description' | t) }}
        </p>
        <div class="flex flex-wrap items-center justify-center gap-4 pt-4">
          <a
            [href]="candidateHref"
            class="inline-flex items-center justify-center rounded-xl bg-white px-7 py-3.5 text-sm font-bold text-blue-700 shadow-lg shadow-black/10 transition-all duration-200 hover:-translate-y-0.5 hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-blue-700"
          >
            {{ candidateText || ('callToAction.candidate' | t) }}
          </a>
          <a
            [href]="employerHref"
            class="inline-flex items-center justify-center rounded-xl border-2 border-white/40 bg-white/10 px-7 py-3.5 text-sm font-bold text-white backdrop-blur-sm transition-all duration-200 hover:-translate-y-0.5 hover:bg-white/20 hover:border-white focus:outline-none focus:ring-2 focus:ring-white"
          >
            {{ employerText || ('callToAction.employer' | t) }}
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
