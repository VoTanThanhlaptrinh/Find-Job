<section class="relative overflow-hidden bg-slate-50/80 py-20 font-body border-t border-slate-200/60" [id]="sectionId">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 items-center gap-12 lg:grid-cols-2">
      <!-- Left image -->
      <div class="flex justify-center">
        <img class="max-h-[480px] w-auto drop-shadow-2xl transition-transform duration-500 hover:scale-105"
          [src]="imageSrc" [alt]="imageAlt" />
      </div>

      <!-- Right content (Centered text and buttons) -->
      <div class="space-y-6 text-center flex flex-col items-center">
        <h2 class="font-headline text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl lg:text-5xl">
          {{ title || ('download.title' | t) }}
          <span class="block text-blue-600">{{ subtitle || ('download.subtitle' | t) }}</span>
        </h2>

        <p class="text-base leading-relaxed text-slate-600 sm:text-lg max-w-lg mx-auto">
          {{ description || ('download.description' | t) }}
        </p>

        <!-- 2 Download Buttons Centered -->
        <div class="flex flex-wrap items-center justify-center gap-4 pt-2">
          <!-- App Store Button -->
          <a [href]="appStoreHref"
            class="flex items-center gap-3.5 rounded-2xl bg-slate-900 px-5 py-3 text-white shadow-lg shadow-slate-900/10 transition-all duration-200 hover:-translate-y-0.5 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900">
            <svg class="h-7 w-7 fill-current" viewBox="0 0 24 24">
              <path
                d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.93-2.85-.9.04-1.99.6-2.61 1.34-.55.63-.99 1.66-.86 2.69.98.08 2-.45 2.54-1.18z" />
            </svg>
            <div class="text-left">
              <p class="text-[10px] uppercase tracking-wider text-slate-400 leading-none">{{ 'download.availableOn' | t
                }}</p>
              <p class="text-sm font-bold leading-tight">{{ 'download.appStore' | t }}</p>
            </div>
          </a>

          <!-- Google Play Button -->
          <a [href]="playStoreHref"
            class="flex items-center gap-3.5 rounded-2xl bg-slate-900 px-5 py-3 text-white shadow-lg shadow-slate-900/10 transition-all duration-200 hover:-translate-y-0.5 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900">
            <svg class="h-6 w-6 fill-current" viewBox="0 0 24 24">
              <path
                d="M3.609 1.814L13.792 12 3.61 22.186a2.404 2.404 0 0 1-.61-1.614V3.428c0-.623.224-1.196.609-1.614zm11.24 11.24l2.42 2.42-12.7 7.332 10.28-9.752zm0-2.108L4.57 1.194l12.7 7.332-2.42 2.42zm1.48 1.48l3.66-2.115c1.03-.596 1.03-1.573 0-2.17l-3.66-2.115-2.09 2.09 2.09 2.31z" />
            </svg>
            <div class="text-left">
              <p class="text-[10px] uppercase tracking-wider text-slate-400 leading-none">{{ 'download.availableOn' | t
                }}</p>
              <p class="text-sm font-bold leading-tight">{{ 'download.playStore' | t }}</p>
            </div>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
