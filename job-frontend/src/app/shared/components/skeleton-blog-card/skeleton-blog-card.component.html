<article
  class="flex min-h-full flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm sm:rounded-3xl"
  aria-hidden="true">
  <!-- Keep the thumbnail ratio identical to a loaded blog card to prevent layout shift. -->
  <div class="animate-shimmer aspect-video w-full bg-slate-100"></div>

  <div class="flex flex-1 flex-col p-5 sm:p-6">
    <div class="mb-4 flex items-center justify-between gap-3">
      <div class="flex gap-2">
        <div class="animate-shimmer h-6 w-[72px] rounded-full bg-blue-50"></div>
        <div class="animate-shimmer h-6 w-[84px] rounded-full bg-indigo-50"></div>
      </div>
      <div class="animate-shimmer h-3 w-16 rounded bg-slate-100"></div>
    </div>

    <div class="mb-3 space-y-2">
      <div class="animate-shimmer h-6 w-[88%] rounded-md bg-slate-200"></div>
      <div class="animate-shimmer h-6 w-[61%] rounded-md bg-slate-200"></div>
    </div>

    <div class="space-y-2">
      <div class="animate-shimmer h-3.5 w-full rounded bg-slate-100"></div>
      <div class="animate-shimmer h-3.5 w-full rounded bg-slate-100"></div>
      <div class="animate-shimmer h-3.5 w-[72%] rounded bg-slate-100"></div>
    </div>

    <div class="mt-auto pt-5">
      <div class="flex items-center justify-between border-t border-slate-100 pt-4">
        <div class="flex min-w-0 items-center gap-3">
          <div class="flex items-center gap-1.5">
            <div class="animate-shimmer h-4 w-4 rounded-full bg-rose-100"></div>
            <div class="animate-shimmer h-3 w-6 rounded bg-slate-200"></div>
          </div>
          <div class="flex min-w-0 items-center gap-2">
            <div class="animate-shimmer h-7 w-7 shrink-0 rounded-full bg-slate-200"></div>
            <div class="animate-shimmer h-3 w-20 rounded bg-slate-100"></div>
          </div>
        </div>
        <div class="animate-shimmer h-4 w-16 shrink-0 rounded bg-blue-100"></div>
      </div>
    </div>
  </div>
</article>
