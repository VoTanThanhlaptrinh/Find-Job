<button
  type="button"
  (click)="scrollToTop()"
  [attr.aria-label]="ariaLabel"
  [title]="ariaLabel"
  class="fixed bottom-20 right-4 sm:bottom-8 sm:right-8 z-40 flex h-11 w-11 sm:h-12 sm:w-12 items-center justify-center rounded-full bg-[#1E63F3] text-white shadow-lg shadow-[#1E63F3]/30 transition-all duration-300 ease-out hover:bg-[#174FCB] hover:shadow-xl hover:shadow-[#1E63F3]/40 hover:-translate-y-1 active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-[#1E63F3] cursor-pointer group"
  [ngClass]="isVisible ? 'opacity-100 translate-y-0 scale-100 pointer-events-auto' : 'opacity-0 translate-y-4 scale-90 pointer-events-none'"
>
  <!-- Up Arrow Icon -->
  <span class="material-symbols-outlined text-[22px] transition-transform duration-200 group-hover:-translate-y-0.5" aria-hidden="true">
    arrow_upward
  </span>
</button>
