<main class="min-h-screen bg-slate-100 py-12 px-4 sm:px-6 lg:px-8 font-body">
  <div class="mx-auto max-w-md">
    <div class="rounded-3xl bg-white p-8 shadow-xl ring-1 ring-slate-200 sm:p-10">
      <!-- Icon & Header -->
      <div class="text-center">
        <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-blue-50 text-blue-600 shadow-sm border border-blue-100">
          <span class="material-symbols-outlined text-[28px]">key</span>
        </div>
        <h1 class="mt-4 font-headline text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl">
          Đặt lại mật khẩu
        </h1>
        <p class="mt-2 text-sm text-slate-500">
          Tạo mật khẩu mới an toàn cho tài khoản của bạn.
        </p>
      </div>

      <form [formGroup]="formGroup" (ngSubmit)="onSubmit()" class="mt-8 space-y-5">
        <input type="hidden" formControlName="random" />

        <!-- New Password Field -->
        <div>
          <label for="newPass" class="mb-1.5 block text-sm font-medium text-slate-700">Mật khẩu mới</label>
          <input
            id="newPass"
            type="password"
            placeholder="Nhập mật khẩu mới"
            formControlName="newPass"
            class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
          />
        </div>

        <!-- Confirm Password Field -->
        <div>
          <label for="confirmPass" class="mb-1.5 block text-sm font-medium text-slate-700">Xác nhận mật khẩu</label>
          <input
            id="confirmPass"
            type="password"
            placeholder="Xác nhận lại mật khẩu"
            formControlName="confirmPass"
            class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
          />
        </div>

        <!-- Feedback Message -->
        @if (message) {
          <div
            class="rounded-xl p-3 text-sm font-medium"
            [ngClass]="isError ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'"
          >
            {{ message }}
          </div>
        }

        <!-- Submit Button -->
        <button
          type="submit"
          class="w-full rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 px-4 py-3 text-sm font-semibold text-white shadow-md shadow-blue-600/20 transition hover:from-blue-700 hover:to-indigo-700 active:scale-95 disabled:cursor-not-allowed disabled:from-slate-400 disabled:to-slate-400 disabled:shadow-none"
        >
          Cập nhật mật khẩu
        </button>
      </form>
    </div>
  </div>
</main>
