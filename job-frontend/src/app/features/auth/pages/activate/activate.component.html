<main class="flex min-h-[70vh] items-center justify-center bg-slate-50 py-12 px-4 sm:px-6 lg:px-8 font-body">
  <div class="w-full max-w-md text-center">
    <div class="rounded-3xl bg-white p-8 shadow-xl ring-1 ring-slate-200 sm:p-10">
      <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-emerald-50 text-emerald-600 shadow-sm border border-emerald-100">
        <span class="material-symbols-outlined text-[36px]">verified</span>
      </div>
      
      <h2 class="mt-6 font-headline text-2xl font-bold tracking-tight text-slate-900">
        {{ message || 'Đang xác thực tài khoản...' }}
      </h2>
      
      <div class="mt-8">
        <a
          href="/"
          class="inline-flex w-full items-center justify-center rounded-xl bg-blue-600 px-5 py-3 text-sm font-semibold text-white shadow-md shadow-blue-600/25 transition hover:bg-blue-500 active:scale-95"
        >
          Quay về trang chủ
        </a>
      </div>
    </div>
  </div>
</main>
