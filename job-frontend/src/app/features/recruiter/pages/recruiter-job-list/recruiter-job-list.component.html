<main class="bg-re-surface text-re-on-surface min-h-screen p-6 md:p-10">
  <section class="w-full lg:w-[70vw] mx-auto space-y-6">
    <header class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold">{{ 'recruiterJobList.title' | t }}</h1>
        <p class="text-re-on-surface-variant mt-1">
          {{ 'recruiterJobList.totalPostedJobs' | t }}: <span class="font-semibold">{{ totalPostedJobs() }}</span>
        </p>
      </div>

      <div class="rounded-full overflow-hidden bg-re-primary">
        <a class="inline-flex items-center justify-center w-full h-full gap-2 text-re-on-primary! px-4 py-2 font-semibold"
          routerLink="/recruiter/jobs/post-job">
          <span class="material-symbols-outlined">add</span>
          {{ 'recruiterJobList.postJob' | t }}
        </a>
      </div>
    </header>

    <div *ngIf="isLoading()" class="flex flex-col items-center gap-6">
      <app-skeleton-job-card [count]="3"></app-skeleton-job-card>
    </div>

    <div *ngIf="!isLoading() && jobs().length === 0"
      class="bg-re-surface-container-low p-6 rounded-xl text-re-on-surface-variant">
      {{ 'recruiterJobList.empty' | t }}
    </div>

    <div *ngIf="!isLoading() && jobs().length > 0" class="flex flex-col items-center gap-6">
      <app-hirer-job-card *ngFor="let job of jobs(); trackBy: trackByJob" [job]="job" (delete)="deleteJob($event)"
        (analyze)="analyzeJob($event)"></app-hirer-job-card>
    </div>

    <footer *ngIf="!isLoading() && jobs().length > 0"
      class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between pt-4 pb-8 border-t border-slate-200/80">
      <!-- Rows Per Page -->
      <div class="flex items-center gap-2 text-sm text-slate-500">
        <label for="job-page-size" class="font-medium text-xs sm:text-sm">{{ 'pagination.rowsPerPage' | t }}:</label>
        <select id="job-page-size"
          class="bg-white border border-slate-200 text-slate-700 rounded-lg px-2.5 py-1 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 shadow-xs cursor-pointer"
          [value]="currentPageSize" (change)="onPageSizeChange($event)">
          <option *ngFor="let option of pageSizeOptions" [value]="option">{{ option }}</option>
        </select>
      </div>

      <!-- Page Nav Controls -->
      <div class="flex items-center gap-1.5">
        <button type="button"
          class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors disabled:opacity-30 disabled:hover:bg-transparent disabled:cursor-not-allowed cursor-pointer"
          [disabled]="!canGoPrev"
          (click)="goPrevPage()">
          <span class="material-symbols-outlined text-[18px]">chevron_left</span>
          <span class="hidden sm:inline">{{ 'pagination.previous' | t }}</span>
        </button>

        <div class="flex items-center gap-1">
          <button *ngFor="let page of pageButtons"
            type="button"
            class="min-w-[36px] h-9 px-2 flex items-center justify-center rounded-lg text-sm font-semibold transition-all duration-150 cursor-pointer"
            [ngClass]="page === currentPage ? 'bg-blue-600 text-white shadow-sm shadow-blue-500/20' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'"
            (click)="goToPage(page)">
            {{ page }}
          </button>
        </div>

        <button type="button"
          class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors disabled:opacity-30 disabled:hover:bg-transparent disabled:cursor-not-allowed cursor-pointer"
          [disabled]="!canGoNext"
          (click)="goNextPage()">
          <span class="hidden sm:inline">{{ 'pagination.next' | t }}</span>
          <span class="material-symbols-outlined text-[18px]">chevron_right</span>
        </button>
      </div>
    </footer>
  </section>
</main>
