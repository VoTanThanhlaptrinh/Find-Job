<div
  class="candidate-shell flex h-screen w-full max-w-full overflow-hidden bg-slate-50 antialiased text-slate-900 font-sans pt-[84px]">
  <!-- SideNavBar Component -->
  <aside role="navigation"
    class="candidate-sidebar h-full flex flex-col border-r border-[#E5E7EB] bg-white pt-6 pb-6 px-4 transition-[width] duration-200 ease-in-out relative z-30 shrink-0"
    [ngClass]="isOpen ? 'w-[280px]' : 'w-20'">
    <!-- Toggle Button on Border -->
    <button (click)="toggleSidebar()"
      type="button"
      class="absolute top-1/2 -translate-y-1/2 -right-[18px] flex h-[36px] w-[36px] min-h-[36px] min-w-[36px] items-center justify-center rounded-full border border-[#E5E7EB] bg-white text-[#475467] hover:text-[#2563EB] hover:border-[#2563EB]/40 shadow-sm transition-all duration-200 focus:outline-none z-50 cursor-pointer"
      [title]="isOpen ? 'Thu gọn' : 'Mở rộng'">
      <span class="material-symbols-outlined text-[20px] transition-transform duration-200"
        [class.rotate-180]="!isOpen">
        chevron_left
      </span>
    </button>
    <!-- Navigation Tabs -->
    <nav class="flex-1 flex flex-col gap-2 overflow-y-auto overflow-x-hidden">
      @for (item of menuItems; track item.route) {
      <a [routerLink]="item.route"
        class="flex min-w-0 h-[52px] min-h-[52px] items-center rounded-[10px] text-[15px] font-medium transition-all duration-200 group cursor-pointer"
        [ngClass]="[
          isOpen ? 'justify-start px-4 gap-[14px]' : 'justify-center px-0 gap-0',
          isActive(item.route, item.exact)
            ? 'bg-[#2563EB] text-white shadow-sm' 
            : 'text-[#475467] hover:bg-[#EFF6FF] hover:text-[#2563EB]'
        ]" (click)="onMenuItemClick()">
        <span class="sidebar-icon material-symbols-outlined text-[22px] w-[22px] h-[22px] flex items-center justify-center shrink-0">{{
          item.icon
        }}</span>
        <span *ngIf="isOpen" class="min-w-0 truncate whitespace-nowrap">{{
          item.nameKey | t
        }}</span>
      </a>
      }
    </nav>

    <!-- Footer Tab: Logout -->
    <div class="mt-auto border-t border-[#E5E7EB] pt-3">
      <a (click)="onLogout()"
        class="flex min-w-0 h-[52px] min-h-[52px] items-center rounded-[10px] text-[15px] font-medium transition-all duration-200 text-[#475467] hover:bg-red-50 hover:text-red-600 group cursor-pointer"
        [ngClass]="
          isOpen ? 'justify-start px-4 gap-[14px]' : 'justify-center px-0 gap-0'
        ">
        <span class="sidebar-icon material-symbols-outlined text-[22px] w-[22px] h-[22px] flex items-center justify-center shrink-0">logout</span>
        <span *ngIf="isOpen" class="min-w-0 truncate whitespace-nowrap">{{ 'header.logout' | t }}</span>
      </a>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="candidate-main min-w-0 flex-1 w-full max-w-full h-full overflow-y-auto overflow-x-hidden p-4 md:p-6 lg:p-8">
    <!-- MAIN ROUTER OUTLET PRESERVED -->
    <router-outlet></router-outlet>
  </main>
</div>
