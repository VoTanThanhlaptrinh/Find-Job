<div role="main" class="max-w-6xl w-full mx-auto antialiased text-slate-900 px-4 md:px-0 pt-4 pb-8">
  <div class="bg-white rounded-2xl sm:rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
    <!-- Header Section (Avatar, Name & Navigation Tabs) -->
    <div role="banner" class="px-6 sm:px-8 pt-6 sm:pt-8 border-b border-slate-100">
      <div class="flex flex-col md:flex-row items-center gap-6 sm:gap-8 pb-6">
        <div class="relative group">
          <img alt="Candidate Profile" class="w-24 h-24 sm:w-28 sm:h-28 rounded-full object-cover border-2 border-slate-100 shadow-sm"
            src="assets/images/avatar.jpg" />
          <button
            class="absolute bottom-0 right-0 bg-blue-600 text-white p-2 rounded-full shadow-md hover:bg-blue-700 transition-colors border-2 border-white">
            <span class="material-symbols-outlined text-sm block">photo_camera</span>
          </button>
        </div>
        <div class="text-center md:text-left">
          <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">{{ 'profile.title' | t }}</h1>
          <p class="text-slate-500 mt-1">{{ 'profile.subtitle' | t }}</p>
        </div>
      </div>

      <!-- Navigation Tabs Bar -->
      <div class="flex items-center gap-2 overflow-x-auto border-t border-slate-100 pt-1 -mb-px">
        <button
          type="button"
          (click)="setActiveTab('info')"
          class="flex items-center gap-2 py-3.5 px-4 font-bold text-sm border-b-2 transition-all whitespace-nowrap cursor-pointer"
          [ngClass]="activeTab === 'info' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-800'"
        >
          <span class="material-symbols-outlined text-[19px]">person</span>
          <span>Thông tin cá nhân</span>
        </button>

        <button
          type="button"
          (click)="setActiveTab('saved-jobs')"
          class="flex items-center gap-2 py-3.5 px-4 font-bold text-sm border-b-2 transition-all whitespace-nowrap cursor-pointer"
          [ngClass]="activeTab === 'saved-jobs' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-800'"
        >
          <span class="material-symbols-outlined text-[19px]">bookmark</span>
          <span>Việc làm đã lưu</span>
          @if (savedJobCount > 0) {
            <span class="rounded-full bg-blue-100 px-2 py-0.5 text-xs font-bold text-blue-600">{{ savedJobCount }}</span>
          }
        </button>

        <button
          type="button"
          (click)="setActiveTab('my-blog')"
          class="flex items-center gap-2 py-3.5 px-4 font-bold text-sm border-b-2 transition-all whitespace-nowrap cursor-pointer"
          [ngClass]="activeTab === 'my-blog' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-800'"
        >
          <span class="material-symbols-outlined text-[19px]">article</span>
          <span>My blog</span>
          @if (blogTotalElements > 0) {
            <span class="rounded-full bg-blue-100 px-2 py-0.5 text-xs font-bold text-blue-600">{{ blogTotalElements }}</span>
          }
        </button>
      </div>
    </div>

    <!-- TAB 1: THÔNG TIN CÁ NHÂN -->
    <div *ngIf="activeTab === 'info'">
      <form [formGroup]="formGroup" (ngSubmit)="onSubmit()" class="p-6 sm:p-8 space-y-8">
        <!-- Section: Basic Info -->
        <div class="space-y-6">
          <div class="flex items-center gap-2.5">
            <span class="material-symbols-outlined text-blue-600 font-semibold">person</span>
            <h2 class="text-lg font-bold text-slate-900">{{ 'profile.basicInfo' | t }}</h2>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
            <!-- Full Name -->
            <div class="flex flex-col gap-2">
              <label class="text-sm font-semibold text-slate-700" for="full_name">
                {{ 'profile.fullName' | t }} <span class="text-red-500">*</span>
              </label>
              <input
                class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-white focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition-all outline-none text-slate-900 placeholder:text-slate-400"
                id="full_name" type="text" [placeholder]="'profile.fullNamePlaceholder' | t" formControlName="fullName" />
              <p class="text-[11px] text-slate-400 italic">{{ 'profile.fullNameHint' | t }}</p>
            </div>

            <!-- Date of Birth -->
            <div class="flex flex-col gap-2">
              <label class="text-sm font-semibold text-slate-700" for="dob">
                {{ 'profile.dob' | t }} <span class="text-red-500">*</span>
              </label>
              <div class="relative custom-datepicker-container">
                <input title="input"
                  class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-white focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition-all outline-none text-slate-900 z-10 active:bg-white cursor-pointer"
                  [matDatepicker]="picker" formControlName="dateOfBirth" readonly (click)="picker.open()" />
                <mat-datepicker-toggle class="absolute right-1 top-1/2 -translate-y-1/2"
                  [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker panelClass="profile-datepicker-panel"></mat-datepicker>
              </div>
            </div>

            <!-- Mobile Number -->
            <div class="flex flex-col gap-2">
              <label class="text-sm font-semibold text-slate-700" for="phone">
                {{ 'profile.phone' | t }} <span class="text-red-500">*</span>
              </label>
              <div class="relative flex">
                <span
                  class="flex items-center px-4 py-2.5 bg-slate-50 border border-r-0 border-slate-200 rounded-l-lg text-slate-500 font-medium text-sm">+84</span>
                <input
                  class="w-full px-4 py-2.5 rounded-r-lg border border-slate-200 bg-white focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition-all outline-none text-slate-900 placeholder:text-slate-400"
                  id="phone" type="tel" [placeholder]="'profile.phonePlaceholder' | t" formControlName="mobile" />
              </div>
            </div>

            <!-- Address -->
            <div class="flex flex-col gap-2">
              <label class="text-sm font-semibold text-slate-700" for="address">
                {{ 'profile.address' | t }} <span class="text-red-500">*</span>
              </label>
              <input
                class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-white focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition-all outline-none text-slate-900 placeholder:text-slate-400"
                id="address" type="text" [placeholder]="'profile.addressPlaceholder' | t" formControlName="address" />
            </div>
          </div>
        </div>

        <!-- Action Footer -->
        <div role="contentinfo" class="flex items-center justify-end gap-4 pt-6 border-t border-slate-100">
          <button type="submit"
            class="px-8 py-2.5 rounded-xl bg-blue-600 text-white hover:bg-blue-700 font-bold text-sm shadow-sm active:scale-[0.98] transition-all flex items-center gap-2 disabled:opacity-50 cursor-pointer"
            [disabled]="formGroup.invalid">
            <span class="material-symbols-outlined text-lg">save</span>
            {{ 'profile.update' | t }}
          </button>
        </div>
      </form>
    </div>

    <!-- TAB 2: VIỆC LÀM ĐÃ LƯU (Isolated Subcomponent) -->
    <div *ngIf="activeTab === 'saved-jobs'" class="p-6 sm:p-8">
      <app-profile-saved-jobs></app-profile-saved-jobs>
    </div>

    <!-- TAB 3: MY BLOG (Isolated Subcomponent) -->
    <div *ngIf="activeTab === 'my-blog'" class="p-6 sm:p-8">
      <app-profile-my-blog (totalBlogsChange)="onTotalBlogsChange($event)"></app-profile-my-blog>
    </div>
  </div>
</div>
