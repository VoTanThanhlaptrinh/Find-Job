@if (hasActiveFilters) {
  <div class="w-full flex flex-wrap items-center gap-2 pt-1 pb-1">
    <div class="inline-flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider text-[#526077] mr-1">
      <span class="material-symbols-outlined text-[16px] text-[#1E63F3]">filter_alt</span>
      <span>{{ 'category.activeFilters.applied' | t }} ({{ chips.length }}):</span>
    </div>

    <!-- Active Chips -->
    @for (chip of chips; track chip.id) {
      <div
        class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#EAF2FF] text-[#174FCB] text-xs sm:text-sm font-semibold border border-blue-200/80 shadow-xs transition-all hover:border-[#1E63F3]"
      >
        <span>{{ chip.label }}</span>
        <button
          type="button"
          (click)="onRemove(chip)"
          class="flex items-center justify-center w-4 h-4 rounded-full text-[#174FCB]/70 hover:text-white hover:bg-[#1E63F3] transition-colors cursor-pointer"
          [attr.aria-label]="('category.activeFilters.removeCondition' | t) + ' ' + chip.label"
          [title]="'category.activeFilters.removeCondition' | t"
        >
          <span class="material-symbols-outlined text-[14px]">close</span>
        </button>
      </div>
    }

    <!-- Clear All Button -->
    <button
      type="button"
      (click)="onClearAll()"
      class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs sm:text-sm font-semibold text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200/60 transition-colors cursor-pointer ml-auto sm:ml-2"
      [title]="'category.activeFilters.clearAllTitle' | t"
    >
      <span class="material-symbols-outlined text-[14px]">restart_alt</span>
      <span>{{ 'category.activeFilters.clearAll' | t }}</span>
    </button>
  </div>
}
