<div class="relative z-20 w-full">
  <form
    (ngSubmit)="onSearchSubmit()"
    class="flex flex-col lg:flex-row items-stretch lg:items-center bg-white p-2 sm:p-2.5 rounded-2xl border border-[#DCE5F2] shadow-lg shadow-blue-950/5 transition-all duration-200 focus-within:border-[#1E63F3] focus-within:ring-4 focus-within:ring-blue-100/70 gap-2 lg:gap-0"
  >
    <!-- 1. Keyword Field (Takes maximum width) -->
    <div class="relative flex-1 lg:flex-[2.5] flex items-center px-3.5 sm:px-4 py-2 min-h-[48px] sm:min-h-[52px]">
      <span class="material-symbols-outlined text-[#1E63F3] text-[22px] mr-3 shrink-0" aria-hidden="true">
        search
      </span>
      <label for="main-search-keyword" class="sr-only">{{ 'category.search.keywordAria' | t }}</label>
      <input
        id="main-search-keyword"
        type="text"
        name="keyword"
        [(ngModel)]="keyword"
        (keydown)="onKeyDown($event)"
        [placeholder]="'category.search.keywordPlaceholder' | t"
        [attr.aria-label]="'category.search.keywordAria' | t"
        class="w-full bg-transparent text-sm sm:text-base font-semibold text-[#0F172A] placeholder-slate-400 outline-none border-none p-0 focus:ring-0"
      />
      @if (keyword) {
        <button
          type="button"
          (click)="keyword = ''"
          class="text-slate-400 hover:text-slate-600 p-1 rounded-full hover:bg-slate-100 transition-colors ml-1 shrink-0 cursor-pointer"
          [attr.aria-label]="'category.search.clearKeyword' | t"
          [title]="'category.search.clearKeyword' | t"
        >
          <span class="material-symbols-outlined text-[18px]">close</span>
        </button>
      }
    </div>

    <!-- Divider 1 (Desktop) -->
    <div class="hidden lg:block h-8 w-[1px] bg-[#DCE5F2] shrink-0 mx-1"></div>

    <!-- 2. Custom Category Dropdown with Search inside -->
    <div class="relative flex-1 lg:flex-[1.5] border-t lg:border-t-0 border-[#DCE5F2]/70 pt-1 lg:pt-0">
      <app-custom-select
        id="search-category-select"
        [ariaLabel]="'category.search.selectCategoryAria' | t"
        [placeholder]="'category.search.selectCategory' | t"
        icon="category"
        variant="search-bar"
        [searchable]="true"
        [searchPlaceholder]="'category.search.searchCategory' | t"
        [options]="categoryOptions"
        [value]="selectedCategoryId"
        (valueChange)="onCategorySelect($event)"
      ></app-custom-select>
    </div>

    <!-- Divider 2 (Desktop) -->
    <div class="hidden lg:block h-8 w-[1px] bg-[#DCE5F2] shrink-0 mx-1"></div>

    <!-- 3. Custom Location Dropdown with Search inside -->
    <div class="relative flex-1 lg:flex-[1.5] border-t lg:border-t-0 border-[#DCE5F2]/70 pt-1 lg:pt-0">
      <app-custom-select
        id="search-location-select"
        [ariaLabel]="'category.search.selectLocationAria' | t"
        [placeholder]="'category.search.selectLocation' | t"
        icon="location_on"
        variant="search-bar"
        [searchable]="true"
        [searchPlaceholder]="'category.search.searchLocation' | t"
        [options]="locationOptions"
        [value]="selectedAddress"
        (valueChange)="onLocationSelect($event)"
      ></app-custom-select>
    </div>

    <!-- 4. Primary Search Button -->
    <div class="shrink-0 pt-2 lg:pt-0 lg:pl-2">
      <button
        type="submit"
        class="w-full lg:w-auto h-[48px] sm:h-[52px] inline-flex items-center justify-center gap-2 px-7 rounded-xl bg-[#1E63F3] hover:bg-[#174FCB] text-white font-bold text-sm sm:text-base shadow-md shadow-[#1E63F3]/25 transition-all duration-200 hover:shadow-lg hover:shadow-[#1E63F3]/35 hover:-translate-y-0.5 active:scale-95 cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-[#1E63F3]"
      >
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">search</span>
        <span>{{ 'category.search.submitButton' | t }}</span>
      </button>
    </div>
  </form>
</div>
