spring:
  jpa:
    hibernate:
      ddl-auto: none

  rabbitmq:
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT} # Mặc định là 5671 cho SSL
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}
    virtual-host: /rabbitmq # Thay đổi theo vhost của bạn
    ssl:
      enabled: true

app:
  cookie:
    secure: true
  frontend-url: ${FRONTEND_URL:https://www.job-listing.world}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://www.job-listing.world,https://job-listing.world,https://job-frontend-gray.vercel.app}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
