spring:
  profiles:
    active: dev # Khi bạn nhấn Run ở local, nó sẽ tự tìm đến application-dev.yml

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  mail:
    host: smtp.gmail.com
    port: 465
    default-encoding: UTF-8
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            scope:
              - email
              - public_profile
      resource-server:
        jwt:
          jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

application:
  service:
    impl:
      deepseek:
        api-key: ${DEEP_SEEK_API_KEY}
      gemini:
        api-key: ${GEMINI_API_KEY}
      secret-key: ${SECRET_KEY}
      expiration: 600000
      amount: 10
      timeLimit: 604800
      max-attemps: 5
      time-out-first: 600
      time-out-second: 86400
      subject-verify: "Kích hoạt tài khoản JobList của bạn"
      email-verify: "Xin chào bạn,Cảm ơn bạn đã đăng ký tài khoản tại JobList. Để hoàn tất quá trình đăng ký, vui lòng nhấn vào liên kết dưới đây để kích hoạt tài khoản: %s . Nếu bạn không thực hiện yêu cầu này, vui lòng bỏ qua email này. Trân trọng, JobList Team."
      subject-oauth2: "Xác thực tài khoản JobList & tạo mật khẩu mới"
      email-oauth2: |
        Chào %s,

        Bạn đang đăng nhập vào JobList lần đầu bằng tài khoản mạng xã hội. Vì vậy, hệ thống chưa có mật khẩu.
        Để bảo vệ tài khoản của bạn, vui lòng xác thực quyền sở hữu email
        và tạo mật khẩu mới qua liên kết sau:

        %s

        Lưu ý:
        • Liên kết này có hiệu lực trong 1 giờ.
        • Nếu bạn không yêu cầu việc này, bạn có thể bỏ qua email này.
        • Mật khẩu nên bao gồm ít nhất 8 ký tự, gồm chữ hoa, chữ thường và số để bảo mật tốt hơn.

        Nếu bạn gặp sự cố, xin vui lòng liên hệ với bộ phận hỗ trợ tại support@joblist.vn hoặc phản hồi email này.

        Cảm ơn bạn đã sử dụng JobList,
        Chúc bạn một ngày tốt lành
        - JobList Team
  config:
    redis:
      host-name: ${REDIS_HOST}
      username: ${REDIS_USERNAME}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  ocr:
    api-key: ${OCR_API_KEY}
  ai:
    agent:
      base-url: https://votanthanh32004-job-portal-matching.hf.space

cloudflare:
  r2:
    account-id: ${CLOUDFLARE_ACCOUNT_ID}
    access-key: ${CLOUDFLARE_ACCESS_KEY}
    secret-key: ${CLOUDFLARE_SECRET_KEY}
    bucket-name: job-portal-resume
    endpoint: https://${cloudflare.r2.account-id}.r2.cloudflarestorage.com

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

app:
  cookie:
    secure: false
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  file-service:
    base-url: ${UPLOAD_SERVICE_BASE_URL:https://upload-service-gamma.vercel.app}
    api-key: ${UPLOAD_SERVICE_API_KEY:}
    connect-timeout-ms: ${UPLOAD_SERVICE_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${UPLOAD_SERVICE_READ_TIMEOUT_MS:10000}
  resume-upload:
    url-expiration-minutes: 10
    session-expiration-minutes: 30
    max-file-size-bytes: 10485760
    temp-prefix: temp
    permanent-prefix: resumes
    cleanup-interval-ms: 300000
    cleanup-batch-size: 50
  idempotency:
    enabled: true
    header-name: Idempotency-Key
    lock-ttl-seconds: 60
    completed-ttl-seconds: 86400
    endpoints:
      - "POST /api/payments"
      - "POST /api/payments/**"
  user-details-cache:
    enabled: true
    ttl-seconds: 300
  hot-cache:
    enabled: true
    default-threshold: 5
    default-window-seconds: 60
    max-body-bytes: 65536
    gzip-threshold-bytes: 2048
    lock-ttl-seconds: 5
    single-flight-wait-ms: 50
    single-flight-max-wait-retries: 3
    max-page: 10
    max-size: 50
    excluded-patterns:
      - "GET /api/auth/activation-links/**"
      - "GET /api/auth/activate/**"
      - "GET /api/auth/refreshToken"
      - "GET /api/auth/logout"
      - "GET /api/auth/password/code/**"
      - "GET /api/auth/password/check-random/**"
      - "GET /api/auth/google/url"
      - "GET /api/account/oauth2"
      - "GET /api/account/roles/**"
      - "GET /api/sse/**"
      - "GET /api/user/resumes/*/view"
      - "GET /api/user/resumes/*/download"
      - "GET /api/hirer/resumes/*/view"
      - "GET /api/hirer/resumes/*/download"
      - "GET /api/home"
      - "GET /api/admin/employers/export"
      - "GET /actuator/**"
    rules:
      # ─── Nhóm A: PUBLIC & Master Data (Fast-path trước JwtFilter) ───
      - id: public_categories
        pattern: "GET /api/v1/categories"
        scope: PUBLIC
        threshold: 3
        window-seconds: 300
        ttl-seconds: 3600
        max-entries: 4
        invalidate-on:
          - "POST /api/admin/categories"
          - "PUT /api/admin/categories/{id}"
          - "DELETE /api/admin/categories/{id}"
      - id: home_init
        pattern: "GET /api/home/init"
        scope: PUBLIC
        threshold: 5
        window-seconds: 60
        ttl-seconds: 600
        max-entries: 4
        invalidate-on:
          - "POST /api/hirer/jobs"
          - "PUT /api/hirer/jobs/{id}"
          - "DELETE /api/hirer/jobs/{id}"
          - "POST /api/admin/jobs"
          - "PATCH /api/admin/jobs/{id}/status"
          - "POST /api/admin/jobs/bulk-action"
          - "PATCH /api/admin/employers/{id}/status"
      - id: address_count
        pattern: "GET /api/addresses/address-count"
        scope: PUBLIC
        threshold: 5
        window-seconds: 60
        ttl-seconds: 600
        max-entries: 4
        invalidate-on:
          - "POST /api/hirer/jobs"
          - "PUT /api/hirer/jobs/{id}"
          - "DELETE /api/hirer/jobs/{id}"
          - "POST /api/admin/jobs"
          - "PATCH /api/admin/jobs/{id}/status"
          - "POST /api/admin/jobs/bulk-action"
          - "POST /api/addresses"
          - "PUT /api/addresses/{id}"
          - "DELETE /api/addresses/{id}"
      - id: public_jobs_newest
        pattern: "GET /api/jobs/newest"
        scope: PUBLIC
        threshold: 5
        window-seconds: 60
        ttl-seconds: 180
        max-entries: 30
        invalidate-on:
          - "POST /api/hirer/jobs"
          - "PUT /api/hirer/jobs/{id}"
          - "DELETE /api/hirer/jobs/{id}"
          - "POST /api/admin/jobs"
          - "PATCH /api/admin/jobs/{id}/status"
          - "POST /api/admin/jobs/bulk-action"
          - "PATCH /api/admin/employers/{id}/status"
      - id: public_jobs_count
        pattern: "GET /api/jobs/count"
        scope: PUBLIC
        threshold: 5
        window-seconds: 60
        ttl-seconds: 180
        max-entries: 2
        invalidate-on:
          - "POST /api/hirer/jobs"
          - "DELETE /api/hirer/jobs/{id}"
          - "POST /api/admin/jobs"
          - "PATCH /api/admin/jobs/{id}/status"
          - "POST /api/admin/jobs/bulk-action"
          - "PATCH /api/admin/employers/{id}/status"
      - id: public_job_exists
        pattern: "GET /api/jobs/{id}/exists"
        scope: PUBLIC
        threshold: 5
        window-seconds: 120
        ttl-seconds: 300
        max-entries: 500
        invalidate-on:
          - "POST /api/hirer/jobs"
          - "DELETE /api/hirer/jobs/{id}"
          - "POST /api/admin/jobs"
          - "PATCH /api/admin/jobs/{id}/status"
          - "POST /api/admin/jobs/bulk-action"
      - id: public_job_detail
        pattern: "GET /api/jobs/{id}"
        scope: PUBLIC
        threshold: 5
        window-seconds: 300
        ttl-seconds: 600
        max-entries: 500
        invalidate-on:
          - "PUT /api/hirer/jobs/{id}"
          - "DELETE /api/hirer/jobs/{id}"
          - "PATCH /api/admin/jobs/{id}/status"
          - "POST /api/admin/jobs/bulk-action"
          - "PUT /api/addresses/*"
          - "PUT /api/admin/categories/*"
      - id: user_blogs_me
        pattern: "GET /api/blogs/me"
        scope: USER
        threshold: 5
        window-seconds: 60
        ttl-seconds: 180
        max-entries: 100
        invalidate-on:
          - "POST /api/blogs"
          - "PUT /api/blogs/{id}"
          - "DELETE /api/blogs/{id}"
          - "POST /api/blogs/likes [all]"
          - "POST /api/blogs/likes/remove [all]"
      - id: public_blog_comments
        pattern: "GET /api/blogs/comments/{pageIndex}/{pageSize}"
        scope: PUBLIC
        threshold: 5
        window-seconds: 60
        ttl-seconds: 120
        max-entries: 30
        invalidate-on:
          - "POST /api/blogs/comments"
      - id: public_blogs_list
        pattern: "GET /api/blogs"
        scope: PUBLIC
        threshold: 5
        window-seconds: 60
        ttl-seconds: 300
        max-entries: 50
        invalidate-on:
          - "POST /api/blogs"
          - "PUT /api/blogs/{id}"
          - "DELETE /api/blogs/{id}"
          - "POST /api/blogs/likes"
          - "POST /api/blogs/likes/remove"
      - id: public_blog_detail
        pattern: "GET /api/blogs/{blogId}"
        scope: PUBLIC
        threshold: 5
        window-seconds: 300
        ttl-seconds: 900
        max-entries: 200
        invalidate-on:
          - "PUT /api/blogs/{blogId}"
          - "DELETE /api/blogs/{blogId}"
          - "POST /api/blogs/likes"
          - "POST /api/blogs/likes/remove"
      - id: public_language
        pattern: "GET /api/language"
        scope: PUBLIC
        threshold: 5
        window-seconds: 300
        ttl-seconds: 86400
        max-entries: 2

      # ─── Nhóm B: Admin Shared Scope (Sau AuthorizationFilter) ───
      - id: admin_dashboard_summary
        pattern: "GET /api/admin/dashboard/summary"
        scope: ROLE
        threshold: 5
        window-seconds: 60
        ttl-seconds: 60
        max-entries: 2
        invalidate-on:
          - "POST /api/auth/hirer/register"
          - "POST /api/admin/job-seekers"
          - "POST /api/hirer/jobs"
          - "DELETE /api/hirer/jobs/{id}"
          - "POST /api/admin/jobs"
          - "PATCH /api/admin/jobs/{id}/status"
          - "POST /api/admin/jobs/bulk-action"
      - id: admin_dashboard_revenue_trend
        pattern: "GET /api/admin/dashboard/revenue-trend"
        scope: ROLE
        threshold: 5
        window-seconds: 60
        ttl-seconds: 300
        max-entries: 6
        invalidate-on:
          - "POST /api/payments"
      - id: admin_dashboard_job_distribution
        pattern: "GET /api/admin/dashboard/job-distribution"
        scope: ROLE
        threshold: 5
        window-seconds: 60
        ttl-seconds: 60
        max-entries: 2
        invalidate-on:
          - "POST /api/hirer/jobs"
          - "DELETE /api/hirer/jobs/{id}"
          - "POST /api/admin/jobs"
          - "PATCH /api/admin/jobs/{id}/status"
          - "POST /api/admin/jobs/bulk-action"
      - id: admin_jobs_pending
        pattern: "GET /api/admin/jobs/pending"
        scope: ROLE
        threshold: 5
        window-seconds: 60
        ttl-seconds: 60
        max-entries: 10
        invalidate-on:
          - "POST /api/admin/jobs"
          - "PATCH /api/admin/jobs/{id}/status"
          - "POST /api/admin/jobs/bulk-action"
      - id: admin_jobs_metrics
        pattern: "GET /api/admin/jobs/metrics"
        scope: ROLE
        threshold: 5
        window-seconds: 60
        ttl-seconds: 60
        max-entries: 2
        invalidate-on:
          - "POST /api/hirer/jobs"
          - "DELETE /api/hirer/jobs/{id}"
          - "POST /api/admin/jobs"
          - "PATCH /api/admin/jobs/{id}/status"
          - "POST /api/admin/jobs/bulk-action"
          - "POST /api/user/applications/**"
      - id: admin_jobs_list
        pattern: "GET /api/admin/jobs"
        scope: ROLE
        threshold: 5
        window-seconds: 60
        ttl-seconds: 60
        max-entries: 30
        invalidate-on:
          - "POST /api/hirer/jobs"
          - "PUT /api/hirer/jobs/{id}"
          - "DELETE /api/hirer/jobs/{id}"
          - "POST /api/admin/jobs"
          - "PATCH /api/admin/jobs/{id}/status"
          - "POST /api/admin/jobs/bulk-action"
          - "POST /api/user/applications/**"
      - id: admin_employers_metrics
        pattern: "GET /api/admin/employers/metrics"
        scope: ROLE
        threshold: 5
        window-seconds: 60
        ttl-seconds: 120
        max-entries: 2
        invalidate-on:
          - "POST /api/auth/hirer/register"
          - "PATCH /api/admin/employers/{id}/status"
      - id: admin_employers_list
        pattern: "GET /api/admin/employers"
        scope: ROLE
        threshold: 5
        window-seconds: 60
        ttl-seconds: 90
        max-entries: 30
        invalidate-on:
          - "POST /api/auth/hirer/register"
          - "PATCH /api/admin/employers/{id}/status"
          - "POST /api/hirer/jobs"
          - "DELETE /api/hirer/jobs/{id}"
      - id: admin_employer_detail
        pattern: "GET /api/admin/employers/{id}"
        scope: ROLE
        threshold: 5
        window-seconds: 120
        ttl-seconds: 180
        max-entries: 50
        invalidate-on:
          - "PATCH /api/admin/employers/{id}/status"
          - "PUT /api/account/profile"
          - "PUT /api/admin/users/*"
          - "POST /api/hirer/jobs"
          - "DELETE /api/hirer/jobs/{id}"
      - id: admin_job_seekers_metrics
        pattern: "GET /api/admin/job-seekers/metrics"
        scope: ROLE
        threshold: 5
        window-seconds: 60
        ttl-seconds: 120
        max-entries: 2
        invalidate-on:
          - "POST /api/auth/user/register"
          - "POST /api/admin/job-seekers"
      - id: admin_job_seekers_region
        pattern: "GET /api/admin/job-seekers/region-distribution"
        scope: ROLE
        threshold: 5
        window-seconds: 120
        ttl-seconds: 300
        max-entries: 2
        invalidate-on:
          - "POST /api/admin/job-seekers"
      - id: admin_job_seekers_list
        pattern: "GET /api/admin/job-seekers"
        scope: ROLE
        threshold: 5
        window-seconds: 60
        ttl-seconds: 90
        max-entries: 30
        invalidate-on:
          - "POST /api/auth/user/register"
          - "POST /api/admin/job-seekers"
      - id: admin_billing_tiers
        pattern: "GET /api/admin/billing/tiers"
        scope: ROLE
        threshold: 5
        window-seconds: 300
        ttl-seconds: 600
        max-entries: 2
        invalidate-on:
          - "PATCH /api/admin/billing/tiers/{id}"
      - id: admin_billing_summary
        pattern: "GET /api/admin/billing/summary"
        scope: ROLE
        threshold: 5
        window-seconds: 60
        ttl-seconds: 120
        max-entries: 2
        invalidate-on:
          - "POST /api/payments"
      - id: admin_billing_transactions
        pattern: "GET /api/admin/billing/transactions"
        scope: ROLE
        threshold: 5
        window-seconds: 60
        ttl-seconds: 60
        max-entries: 20
        invalidate-on:
          - "POST /api/payments"
      - id: admin_users_page
        pattern: "GET /api/admin/users/page"
        scope: ROLE
        threshold: 5
        window-seconds: 60
        ttl-seconds: 60
        max-entries: 20
        invalidate-on:
          - "POST /api/admin/users"
          - "PUT /api/admin/users/{id}"
          - "DELETE /api/admin/users/{id}"
          - "POST /api/auth/user/register"
          - "POST /api/auth/hirer/register"
          - "PUT /api/account/profile"
          - "PATCH /api/admin/employers/{id}/status"

      # ─── Nhóm C: User-Scoped (Sau AuthorizationFilter, khóa theo userId) ───
      - id: user_job_match
        pattern: "GET /api/user/jobs/match/{cvId}"
        scope: USER
        threshold: 3
        window-seconds: 120
        ttl-seconds: 600
        max-entries: 300
        invalidate-on:
          - "DELETE /api/user/resumes/{cvId}"
          - "POST /api/user/resumes/{cvId}/analyze"
          - "POST /api/hirer/jobs [all]"
          - "DELETE /api/hirer/jobs/{id} [all]"
          - "POST /api/hirer/jobs/{id}/analyze [all]"
      - id: hirer_jobs_posted_count
        pattern: "GET /api/hirer/jobs/posted/count"
        scope: USER
        threshold: 5
        window-seconds: 60
        ttl-seconds: 120
        max-entries: 150
        invalidate-on:
          - "POST /api/hirer/jobs"
          - "DELETE /api/hirer/jobs/{id}"
          - "POST /api/admin/jobs [all]"
          - "PATCH /api/admin/jobs/{id}/status [all]"
          - "POST /api/admin/jobs/bulk-action [all]"
      - id: hirer_jobs_posted
        pattern: "GET /api/hirer/jobs/posted"
        scope: USER
        threshold: 5
        window-seconds: 60
        ttl-seconds: 120
        max-entries: 150
        invalidate-on:
          - "POST /api/hirer/jobs"
          - "PUT /api/hirer/jobs/{id}"
          - "DELETE /api/hirer/jobs/{id}"
          - "POST /api/hirer/jobs/{id}/analyze"
          - "POST /api/user/applications/** [all]"
          - "POST /api/admin/jobs [all]"
          - "PATCH /api/admin/jobs/{id}/status [all]"
          - "POST /api/admin/jobs/bulk-action [all]"
      - id: hirer_job_candidates
        pattern: "GET /api/hirer/applications/jobs/{jobId}/candidates/{pageIndex}/{pageSize}"
        scope: USER
        threshold: 5
        window-seconds: 60
        ttl-seconds: 60
        max-entries: 100
        invalidate-on:
          - "POST /api/user/applications/** [all]"
      - id: user_applied_jobs
        pattern: "GET /api/user/applied"
        scope: USER
        threshold: 5
        window-seconds: 60
        ttl-seconds: 120
        max-entries: 150
        invalidate-on:
          - "POST /api/user/applications/**"
          - "PUT /api/hirer/jobs/{id} [all]"
          - "DELETE /api/hirer/jobs/{id} [all]"
      - id: user_application_status
        pattern: "GET /api/user/applications/{jobId}/status"
        scope: USER
        threshold: 5
        window-seconds: 60
        ttl-seconds: 120
        max-entries: 300
        invalidate-on:
          - "POST /api/user/applications/**"
      - id: user_resumes_analyzed
        pattern: "GET /api/user/resumes/analyzed"
        scope: USER
        threshold: 5
        window-seconds: 60
        ttl-seconds: 120
        max-entries: 150
        invalidate-on:
          - "POST /api/user/resume-uploads/*/complete"
          - "POST /api/user/applications/submit-upload"
          - "DELETE /api/user/resumes/{id}"
          - "POST /api/user/resumes/{id}/analyze"
      - id: user_resumes_list
        pattern: "GET /api/user/resumes"
        scope: USER
        threshold: 5
        window-seconds: 60
        ttl-seconds: 120
        max-entries: 150
        invalidate-on:
          - "POST /api/user/resume-uploads/*/complete"
          - "POST /api/user/applications/submit-upload"
          - "DELETE /api/user/resumes/{id}"
          - "POST /api/user/resumes/{id}/analyze"
      - id: user_resume_detail
        pattern: "GET /api/user/resumes/{id}"
        scope: USER
        threshold: 5
        window-seconds: 60
        ttl-seconds: 120
        max-entries: 150
        invalidate-on:
          - "DELETE /api/user/resumes/{id}"
          - "POST /api/user/resumes/{id}/analyze"
      - id: user_addresses
        pattern: "GET /api/addresses"
        scope: USER
        threshold: 5
        window-seconds: 60
        ttl-seconds: 300
        max-entries: 100
        invalidate-on:
          - "POST /api/addresses"
          - "PUT /api/addresses/{id}"
          - "DELETE /api/addresses/{id}"
      - id: user_payments_me
        pattern: "GET /api/payments/me"
        scope: USER
        threshold: 5
        window-seconds: 60
        ttl-seconds: 180
        max-entries: 100
        invalidate-on:
          - "POST /api/payments"
      - id: user_payment_detail
        pattern: "GET /api/payments/{id}"
        scope: USER
        threshold: 5
        window-seconds: 120
        ttl-seconds: 600
        max-entries: 200
      - id: user_account_profile
        pattern: "GET /api/account/profile"
        scope: USER
        threshold: 5
        window-seconds: 60
        ttl-seconds: 300
        max-entries: 200
        invalidate-on:
          - "PUT /api/account/profile"
          - "PUT /api/admin/users/* [all]"
      - id: admin_current_user
        pattern: "GET /api/admin/users"
        scope: USER
        threshold: 5
        window-seconds: 60
        ttl-seconds: 300
        max-entries: 20
        invalidate-on:
          - "PUT /api/account/profile"
          - "PUT /api/admin/users/* [all]"


